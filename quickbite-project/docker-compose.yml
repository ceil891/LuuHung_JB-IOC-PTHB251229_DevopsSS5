name: quickbite
services:
  quickbite-user:
    image: quickbite-user-service:latest
    build: ./user-service
    container_name: quickbite-user
    ports:
      - "${USER_SERVER_PORT}:${USER_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_NAME: ${USER_DB_NAME:?Set USER_DB_NAME in .env}
      DB_USERNAME: ${USER_DB_USERNAME:?Set USER_DB_USERNAME in .env}
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      SERVER_PORT: ${USER_SERVER_PORT:?Set USER_SERVER_PORT in .env}
    networks:
      - quickbite-net
    restart: unless-stopped
  quickbite-restaurant:
    image: quickbite-restaurant-service:latest
    build: ./restaurant-service
    container_name: quickbite-restaurant
    ports:
      - "${RESTAURANT_SERVER_PORT}:${RESTAURANT_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_NAME: ${RESTAURANT_DB_NAME:?Set RESTAURANT_DB_NAME in .env}
      DB_USERNAME: ${RESTAURANT_DB_USERNAME:?Set RESTAURANT_DB_USERNAME in .env}
      DB_PASSWORD: ${RESTAURANT_DB_PASSWORD:?Set RESTAURANT_DB_PASSWORD in .env}
      SERVER_PORT: ${RESTAURANT_SERVER_PORT:?Set RESTAURANT_SERVER_PORT in .env}
    networks:
      - quickbite-net
    restart: unless-stopped
  quickbite-order:
    image: quickbite-order-service:latest
    build: ./order-service
    container_name: quickbite-order
    ports:
      - "${ORDER_SERVER_PORT}:${ORDER_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_NAME: ${ORDER_DB_NAME:?Set ORDER_DB_NAME in .env}
      DB_USERNAME: ${ORDER_DB_USERNAME:?Set ORDER_DB_USERNAME in .env}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      SERVER_PORT: ${ORDER_SERVER_PORT:?Set ORDER_SERVER_PORT in .env}
    networks:
      - quickbite-net
    restart: unless-stopped
  quickbite-notification:
    image: quickbite-notification-service:latest
    build: ./notification-service
    container_name: quickbite-notification
    ports:
      - "${NOTIFICATION_SERVER_PORT}:${NOTIFICATION_SERVER_PORT}"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_NAME: ${NOTIFICATION_DB_NAME:?Set NOTIFICATION_DB_NAME in .env}
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME:?Set NOTIFICATION_DB_USERNAME in .env}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      SERVER_PORT: ${NOTIFICATION_SERVER_PORT:?Set NOTIFICATION_SERVER_PORT in .env}
    networks:
      - quickbite-net
    restart: unless-stopped

networks:
  quickbite-net:
    name: quickbite-net
    external: true
